<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VHL | Лига</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>.tab-content, .view-section { display: none; } .active { display: block; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans">
    <div class="bg-zinc-900 border-b border-zinc-800 text-right px-4 py-1 text-xs">
        <button onclick="promptAdmin()" class="text-zinc-400 hover:text-blue-400 font-mono"><i class="fa-solid fa-lock mr-1"></i> Панель управления</button>
    </div>
    <div id="view-public" class="view-section active">
        <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center gap-3"><div class="bg-blue-600 text-white px-3 py-1 rounded font-black text-xl italic">VHL</div></div>
                <nav class="flex bg-zinc-950 p-1 rounded border border-zinc-800 text-xs">
                    <button onclick="switchTab('table')" id="btn-table" class="tab-btn px-3 py-1.5 rounded bg-blue-600 text-white font-semibold">Таблица</button>
                    <button onclick="switchTab('matches')" id="btn-matches" class="tab-btn px-3 py-1.5 rounded text-zinc-400">Календарь</button>
                    <button onclick="switchTab('stats')" id="btn-stats" class="tab-btn px-3 py-1.5 rounded text-zinc-400">Бомбардиры</button>
                </nav>
            </div>
        </header>
        <main class="max-w-7xl mx-auto px-4 py-6">
            <section id="tab-table" class="tab-content active">
                <h2 class="text-lg font-bold uppercase text-blue-500 mb-3">Регулярный Чемпионат VHL</h2>
                <div class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-zinc-800/50 text-zinc-400 text-xs border-b border-zinc-800 uppercase"><th class="p-3 text-center">№</th><th class="p-3">Клуб</th><th class="p-3 text-center">И</th><th class="p-3 text-center">В</th><th class="p-3 text-center">ВО</th><th class="p-3 text-center">ПО</th><th class="p-3 text-center">П</th><th class="p-3 text-center">Разн</th><th class="p-3 text-center text-blue-400 font-bold">Очки</th></tr></thead><tbody id="table-main-body" class="divide-y divide-zinc-800/40"></tbody></table></div>
            </section>
            <section id="tab-matches" class="tab-content"><h1 class="text-xl font-bold uppercase mb-4">Расписание игр</h1><div id="public-matches-container" class="grid gap-4 md:grid-cols-2"></div></section>
            <section id="tab-stats" class="tab-content"><h1 class="text-xl font-bold uppercase mb-4">Бомбардиры (Г+П)</h1><div class="bg-zinc-900 rounded-xl border border-zinc-800 overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="bg-zinc-800/50 text-zinc-400 text-xs border-b border-zinc-800 uppercase"><th class="p-3 text-center">Поз</th><th class="p-3">Игрок</th><th class="p-3">Команда</th><th class="p-3 text-center">Г</th><th class="p-3 text-center">П</th><th class="p-3 text-center text-blue-400 font-bold">Очки</th></tr></thead><tbody id="public-players-list" class="divide-y divide-zinc-800/40"></tbody></table></div></section>
        </main>
    </div>
    <div id="view-admin" class="view-section">
        <header class="bg-red-950/40 border-b border-red-900/40 px-4 py-3 flex justify-between items-center"><h1 class="font-bold text-sm uppercase">Панель Управления</h1><button onclick="exitAdmin()" class="bg-zinc-900 border border-zinc-700 px-3 py-1 text-xs rounded">Выйти</button></header>
        <main class="max-w-7xl mx-auto px-4 py-6 grid gap-6 md:grid-cols-3">
            <div class="space-y-4">
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800"><h3 class="text-xs font-bold text-zinc-400 mb-2">Создать Клуб</h3><input id="team-name" type="text" placeholder="Название" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs mb-2 text-white"><input id="team-logo" type="text" placeholder="URL логотипа" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs mb-2 text-white"><button onclick="addTeam()" class="w-full bg-blue-600 font-bold p-2 rounded text-xs uppercase">Добавить</button></div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800"><h3 class="text-xs font-bold text-zinc-400 mb-2">Календарь</h3><button onclick="generateSchedule()" class="w-full bg-amber-600 font-bold p-2 rounded text-xs uppercase">Создать сетку игр</button></div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800"><h3 class="text-xs font-bold text-zinc-400 mb-2">Внести Бомбардира</h3><input id="player-name" type="text" placeholder="Имя Фамилия" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs mb-2 text-white"><select id="player-team" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs mb-2 text-zinc-300"></select><div class="grid grid-cols-2 gap-2 mb-2"><input id="player-goals" type="number" placeholder="Г" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs text-center text-white"><input id="player-assists" type="number" placeholder="П" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs text-center text-white"></div><button onclick="addPlayer()" class="w-full bg-purple-600 font-bold p-2 rounded text-xs uppercase">Добавить</button></div>
            </div>
            <div class="md:col-span-2 space-y-4">
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800"><h3 class="text-xs font-bold text-zinc-300 mb-2">Результаты Матчей</h3><select id="admin-match-select" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs mb-2 text-zinc-300"></select><div class="grid grid-cols-2 gap-2 mb-2"><input id="admin-score-home" type="number" placeholder="Хозяева" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs text-center text-white"><input id="admin-score-away" type="number" placeholder="Гости" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs text-center text-white"></div><select id="admin-match-status" class="w-full bg-zinc-950 border border-zinc-800 p-2 rounded text-xs mb-2 text-zinc-400"><option value="FT">Основное время</option><option value="OT">Овертайм/Буллиты</option></select><button onclick="saveMatchScore()" class="w-full bg-green-600 font-bold p-2 rounded text-xs uppercase">Записать</button></div>
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800 text-xs"><div class="grid grid-cols-2 gap-4"><div><p class="font-bold text-zinc-500 mb-1 border-b border-zinc-800">Клубы</p><ul id="admin-teams-list" class="space-y-1"></ul></div><div><p class="font-bold text-zinc-500 mb-1 border-b border-zinc-800">Игроки</p><ul id="admin-players-list" class="space-y-1"></ul></div></div></div>
            </div>
        </main>
    </div>
    <script src="/public/script.js"></script>
</body>
</html>
